{% extends "base.html" %}

{% block title %}
Interview Dashboard
{% endblock %}

{% block content %}

<div class="main-container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">
                    <h3 class="text-center">Schedule Interview</h3>
                </div>

                <div class="card-body">

<form method="post" action="/interview">
    <label>Candidate Name</label><br>
    <input
    type="text"
    name="candidate_name"
    class="form-control mb-3"
    value="{{ candidate.candidate_name if candidate else '' }}"
    readonly
><br><br>

    <label>Email</label><br>
   <input
    type="email"
    name="email"
    class="form-control mb-3"
    value="{{ candidate.email if candidate else '' }}"
    readonly
>
       <br><br>

    <label>Date</label><br>
    <input
    type="date"
    name="interview_date"
    class="form-control mb-3"
    required
>
    <br><br>

    <label>Time</label><br>
    <input
    type="time"
    name="interview_time"
    class="form-control mb-3"
    required
>
    <br><br>

    <label>Mode</label><br>

    <select name="interview_mode" class="form-select mb-4">
    <option>Online</option>
    <option>Offline</option>
</select>
    <br><br>

    <button type="submit" class="btn btn-success w-100">
    Schedule Interview
</button>
</form>
</div>

            </div>

        </div>

    </div>

</div>

{% if questions %}

<div class="card shadow mt-4">

    <div class="card-header bg-dark text-white">
        <h4>AI Generated Interview Questions</h4>
    </div>

    <div class="card-body">

        <ol>

        {% for question in questions %}

            <li class="mb-3">
                {{ question }}
            </li>

        {% endfor %}

        </ol>

    </div>

</div>

{% endif %}

{% endblock %}
