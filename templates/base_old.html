<!DOCTYPE html>
<html>

<head>
    <title>{% block title %}Resume Screening{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css"> 
    <style>

.nav-link{
    color: black !important;
    font-weight: 600;
}

.nav-link:hover{
    color: #0d6efd !important;
}

.nav-link.active{
    color: #0d6efd !important;
    border-bottom: 2px solid #0d6efd;
}
</style>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="/">Resume Screening</a>

            <div class="navbar-nav ms-auto d-flex flex-row">

               <a class="nav-link px-3 {% if request.url.path=='/' %}active{% endif %}" href="/">Home</a>

<a class="nav-link px-3 {% if request.url.path.startswith('/history') %}active{% endif %}" href="/history">Resume History</a>

<a class="nav-link px-3 {% if request.url.path.startswith('/jobs') %}active{% endif %}" href="/jobs">Job Descriptions</a>

<a class="nav-link px-3 {% if request.url.path.startswith('/shortlisted') %}active{% endif %}" href="/shortlisted">Shortlisted</a>

<a class="nav-link px-3 {% if request.url.path.startswith('/interviews') %}active{% endif %}" href="/interviews">Interviews</a>
            </div>

        </div>
    </nav>

    <div class="container mt-4">

        {% block content %}
        {% endblock %}

    </div>

</body>

</html>
